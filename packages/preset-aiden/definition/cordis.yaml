- id: session-protocols
  name: cordis:group
  group: true
  inject: [loader]
  isolate:
    doppelgangerContext: persona
    doppelgangerTools: persona
    doppelgangerInstanceSqlite: persona
    doppelgangerMemory: persona
    doppelgangerPersona: persona
  config:
    - id: context
      name: cordis:context
    - id: tools
      name: cordis:tools
    - id: storage
      name: cordis:storage
      inject: [doppelgangerPersona]
    - id: memory
      name: cordis:memory
      inject: [doppelgangerInstanceSqlite, doppelgangerPersona]
    - id: memory-protocol
      name: cordis:memory-protocol
      inject: [doppelgangerMemory, doppelgangerTools, doppelgangerContext]
    - id: memory-capture
      name: cordis:memory-capture
      inject: [doppelgangerMemory, doppelgangerPersona]
    - id: identity
      name: cordis:identity
      inject: [doppelgangerContext, doppelgangerPersona]
    - id: traits
      name: cordis:traits
      inject: [doppelgangerContext, doppelgangerPersona]
